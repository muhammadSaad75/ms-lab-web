<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#070a12" />
<!-- Per-page title, description, canonical, robots, OG/Twitter text and JSON-LD come from src/config/seo.ts:
     injected here at build time by scripts/prerender.mjs, and kept in sync on navigation by useSeo -->
<!--seo-->
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="sitemap" type="application/xml" href="/sitemap.xml" />
<meta name="author" content="MS Labs" />
<meta property="og:site_name" content="MS Labs" />
<meta property="og:locale" content="en_US" />
<meta property="og:image" content="https://mslabs.online/og.png" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="MS Labs — Turning Problems Into Better Digital Solutions." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://mslabs.online/og.png" />
<!-- Without JS, scroll-reveal elements would stay at their hidden starting style -->
<noscript><style>[style*="opacity:0"]{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
